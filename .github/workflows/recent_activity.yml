name: Recent Activity Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  update-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.ghrs_github_api_token }}
          user: ${{ github.repository_owner }}
          filename: profile/activity.svg

          # Métricas básicas (incluye total de stars automáticamente)
          base: activity, community, repositories

          # 100 repos por query = timeout de la API GraphQL -> nodes vacío
          repositories_batch: 20
          repositories_forks: no
          repositories_affiliations: owner

          # Plugin de lenguajes
          plugin_languages: yes
          plugin_languages_limit: 8          # máximo permitido
          plugin_languages_other: yes        # agrupa el resto en "Other"
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_colors: github
          plugin_languages_details: bytes-size, percentage

          # Gráfico de stars que HAN RECIBIDO tus repos
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: chartist
          plugin_stargazers_worldmap: yes
          plugin_stargazers_worldmap_token: ${{ secrets.ghrs_github_api_token }}
          plugin_stargazers_worldmap_sample: 200

          # Excluir repositorios privados (si los tienes)
          repositories_skipped: >-
            rgglez-unir-ai-master,
            unir-modam-2080d-iia-actividad2,
            unir-nlp-actividad1-corpus-ampliado,
            klanet-configurator,
            games-syg,
            kapta-simpleform,
            rgglez-website,
            yama